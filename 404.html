<!DOCTYPE html>
<!--
  Página 404 para GitHub Pages (se sirve automáticamente en cualquier ruta inexistente).
  Si algún día el sitio pasa a un dominio propio, cambiá las 3 URLs absolutas
  que aparecen en los links de esta página (buscar "studio74dev.github.io").
-->
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B0B0C" />
  <title>404 — Página no encontrada · Studio 74</title>
  <link rel="icon" type="image/svg+xml" href="https://studio74dev.github.io/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --ink: #0B0B0C;
      --ink-deep: #050506;
      --ink-soft: #101114;
      --signal: #D2FF3A;
      --cream: #F4F3EF;
      --cream-70: rgba(244, 243, 239, 0.7);
      --cream-40: rgba(244, 243, 239, 0.4);
      --cream-12: rgba(244, 243, 239, 0.12);
      --font-sans: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3rem);
      font-family: 'DM Sans', system-ui, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #101114 0%, #0B0B0C 55%, #050506 100%);
      color: #F4F3EF;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    .wrap {
      display: grid;
      gap: 1.4rem;
      justify-items: center;
      max-width: 34rem;
    }

    .mark {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(210, 255, 58, 0.18);
    }

    .label {
      font-family: 'Space Mono', ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #D2FF3A;
    }

    h1 {
      font-family: 'Space Grotesk', 'DM Sans', system-ui, sans-serif;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    p {
      color: rgba(244, 243, 239, 0.7);
      max-width: 30rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      justify-content: center;
      margin-top: 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1), background 240ms ease, border-color 240ms ease;
    }

    .btn--primary {
      background: #D2FF3A;
      color: #0B0B0C;
    }

    .btn--primary:hover {
      transform: translateY(-2px);
    }

    .btn--ghost {
      border: 1px solid rgba(244, 243, 239, 0.16);
      color: rgba(244, 243, 239, 0.9);
    }

    .btn--ghost:hover {
      transform: translateY(-2px);
      border-color: rgba(244, 243, 239, 0.32);
      background: rgba(244, 243, 239, 0.04);
    }

    .btn:focus-visible {
      outline: 2px solid rgba(210, 255, 58, 0.7);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Studio 74" focusable="false">
      <rect width="100" height="100" rx="18" fill="#D2FF3A" />
      <g fill="none" stroke="#0B0B0C">
        <path d="M7.7 10.9H64L13 88" stroke-width="6.2" />
        <path d="M7.7 90.4H18" stroke-width="6.4" />
        <path d="M90 7.7V78" stroke-width="5.5" />
        <path d="M90 19L52 59.5M50 60.5H90" stroke-width="4.2" />
      </g>
      <rect x="85" y="86" width="8" height="8" fill="#0B0B0C" />
    </svg>

    <span class="label">Error 404</span>
    <h1>Esta página no existe.</h1>
    <p>Es posible que el enlace esté desactualizado o mal escrito. Puede volver al inicio desde aquí.</p>

    <div class="actions">
      <a class="btn btn--primary" href="https://studio74dev.github.io/">
        Volver al inicio
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </a>
      <a class="btn btn--ghost" href="https://studio74dev.github.io/#contacto">
        Contactarnos
      </a>
    </div>
  </main>
</body>

</html>

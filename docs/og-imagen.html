<style>

  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0B; }
  body { position: relative; font-family: 'Geist', sans-serif; color: #F5F5F2; -webkit-font-smoothing: antialiased; }

  .rotulo { position: absolute; top: 172px; left: 72px; font-family: 'Geist Mono', monospace; font-size: 17px;

    letter-spacing: -0.045em; line-height: 1.02; }
  h1 span { color: #8EA8FF; }
  .pie { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px; border-top: 1px solid rgba(255,255,255,.12); font-family: 'Geist Mono', monospace; font-size: 17px; color: #A1A1A6; }
  .pie b { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 10px;

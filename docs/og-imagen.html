<!-- Fuente de assets/og.png (1200x630). Para regenerarla: servir el repo, abrir docs/og-imagen.html con la ventana en 1200x630 y sacar una captura. -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Michroma&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0B; }
  body { position: relative; font-family: 'Geist', sans-serif; color: #F5F5F2; -webkit-font-smoothing: antialiased; }
  .luz { position: absolute; inset: 0;
    background:
      radial-gradient(38% 55% at 50% 52%, rgba(210,255,58,.16), transparent 70%),
      radial-gradient(30% 45% at 26% 78%, rgba(158,232,196,.16), transparent 70%),
      radial-gradient(30% 45% at 76% 74%, rgba(156,200,255,.16), transparent 70%);
    filter: blur(8px); }
  .marco { position: absolute; inset: 28px; border-radius: 16px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 22px 22px; }
  .barra { position: absolute; top: 28px; left: 28px; right: 28px; height: 54px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; border-bottom: 1px solid rgba(255,255,255,.1); font-family: 'Geist Mono', monospace; font-size: 14px; color: #6C6C72; }
  .marca { display: flex; align-items: center; gap: 14px; color: #F5F5F2; font-family: 'Michroma', sans-serif; font-size: 17px; letter-spacing: .32em; }
  .marca svg { width: 30px; height: 30px; }
  .props { display: flex; gap: 22px; }
  .props b { color: #F5F5F2; font-weight: 500; }
  .centro { position: absolute; left: 0; right: 0; top: 118px; display: flex; flex-direction: column; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.06);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); font-size: 17px; color: #9A9A9F; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #D2FF3A; box-shadow: 0 0 0 4px rgba(210,255,58,.15); }
  .sel { position: relative; margin-top: 34px; padding: 8px 28px 14px; border: 1.5px dashed rgba(59,130,246,.9); }
  .tag { position: absolute; top: -15px; left: -2px; padding: 2px 8px; border-radius: 6px; background: #3B82F6; color: #fff;
    font-family: 'Geist Mono', monospace; font-size: 14px; }
  .m { position: absolute; width: 11px; height: 11px; background: #fff; border: 2px solid #3B82F6; border-radius: 2px; }
  .m1 { top: -6px; left: -6px; } .m2 { top: -6px; right: -6px; } .m3 { bottom: -6px; left: -6px; } .m4 { bottom: -6px; right: -6px; }
  h1 { font-size: 92px; font-weight: 600; letter-spacing: -0.055em; line-height: .98; text-align: center; }
  h1 span { color: #D2FF3A; }
  .bajada { margin-top: 28px; font-size: 24px; color: #9A9A9F; }
  .bajada b { color: #F5F5F2; font-weight: 500; }
  .pie { position: absolute; left: 56px; right: 56px; bottom: 50px; display: flex; justify-content: space-between;
    font-family: 'Geist Mono', monospace; font-size: 15px; color: #6C6C72; }
  .pie .lima { color: #D2FF3A; }
</style>
</head>
<body>
  <div class="luz"></div>
  <div class="marco"></div>
  <div class="barra">
    <span class="marca">
      <svg viewBox="0 0 100 100"><g fill="none" stroke="#D2FF3A"><path d="M7.7 10.9H64L13 88" stroke-width="6.2"/><path d="M7.7 90.4H18" stroke-width="6.4"/><path d="M90 7.7V78" stroke-width="5.5"/><path d="M90 19L52 59.5M50 60.5H90" stroke-width="4.2"/></g><rect x="85" y="86" width="8" height="8" fill="#D2FF3A"/></svg>
      STUDIO 74
    </span>
    <span class="props"><span>Peso <b>600</b></span><span>Fuente <b>Geist</b></span><span>Alinear <b>centro</b></span></span>
  </div>
  <div class="centro">
    <p class="chip"><i></i>Estudio de desarrollo de software</p>
    <div class="sel">
      <span class="tag">&lt;h1&gt;</span>
      <span class="m m1"></span><span class="m m2"></span><span class="m m3"></span><span class="m m4"></span>
      <h1>Software a medida<br />para tu negocio<span>.</span></h1>
    </div>
    <p class="bajada">Sistemas de gestión, turnos, reservas y webs. <b>Lo dejamos funcionando.</b></p>
  </div>
  <div class="pie"><span>studio74dev.github.io</span><span class="lima">Pinamar, Villa Gesell y Madariaga</span></div>
</body>
</html>
